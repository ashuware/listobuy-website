<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>अंशी TV Controller</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; padding: 14px; max-width: 500px; margin: auto; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { font-size: 19px; color: #ffcc00; }
    #tv-state { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #222; font-weight: bold; }
    .card { background: #1a1a1a; padding: 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #2a2a2a; }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { width: 100%; padding: 12px 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-live { background: #e60000; color: #fff; }
    .btn-stop { background: #333; color: #fff; }
    .btn-switch { background: #262626; color: #ddd; margin-top: 8px; padding: 10px; font-size: 13px; }
    .btn-refresh { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; margin-top: 8px; padding: 10px; font-size: 13px; }
    .btn-yt { background: #ff0000; color: #fff; }
    .btn-photo { background: #1f6feb; color: #fff; }
    .btn-video { background: #2ea043; color: #fff; }
    .btn-update { background: #ffcc00; color: #000; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #252525; color: #fff; font-size: 14px; margin-bottom: 8px; }
    video { width: 100%; height: 180px; background: #000; margin-top: 8px; border-radius: 8px; object-fit: cover; display: none; }
    #status { margin-bottom: 10px; font-size: 13px; color: #4ade80; text-align: center; font-weight: bold; min-height: 18px; }
    .hint { font-size: 11px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>📡 अंशी TV रिमोट</h2>
    <div id="tv-state">🟡 Starting...</div>
  </div>
  <div id="status"></div>

  <div class="card">
    <div class="card-title">1. लाइव कैमरा (16:9 Full Screen + Audio)</div>
    <div class="row-btns">
      <button class="btn-live" onclick="startCamera()">🔴 Go Live</button>
      <button class="btn-stop" onclick="stopEverything()">⏹ Stop All TVs</button>
    </div>
    <button class="btn-switch" onclick="switchCamera()">🔄 कैमरा बदलें (Front/Back)</button>
    <button class="btn-refresh" onclick="refreshAllTVs()">🔄 Refresh All TVs</button>
    <video id="camera-preview" muted autoplay playsinline></video>
    <div class="hint">नोट: ज़्यादा TV जुड़ने पर क्वालिटी अपने-आप थोड़ी घटती है ताकि delay न आए।</div>
  </div>

  <div class="card">
    <div class="card-title">2. YouTube चलाएं (Live Timestamp Sync)</div>
    <input type="text" id="yt-url" placeholder="YouTube लिंक पेस्ट करें...">
    <button class="btn-yt" onclick="playYouTubeOnTV()">▶ Play YouTube</button>
  </div>

  <div class="card">
    <div class="card-title">3. फ़ोटो दिखाएं</div>
    <input type="file" id="photo-input" accept="image/*">
    <button class="btn-photo" onclick="sendPhotoToTV()">🖼️ Show Photo</button>
  </div>

  <div class="card">
    <div class="card-title">4. गैलरी वीडियो चलाएं (आवाज़ के साथ)</div>
    <input type="file" id="gallery-video-input" accept="video/*">
    <button class="btn-video" onclick="streamGalleryVideo()">🎬 Play Video</button>
    <video id="gallery-video-player" controls playsinline></video>
  </div>

  <div class="card">
    <div class="card-title">5. न्यूज़ पट्टी (Ticker)</div>
    <input type="text" id="marquee-input" placeholder="ताज़ा ख़बर लिखें...">
    <button class="btn-update" onclick="updateMarquee()">📺 Update News</button>
  </div>

<script>
  const CONTROLLER_ID = 'anshi-tv-master-controller-99';

  const ICE_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };

  function forceH264(sdp) {
    const lines = sdp.split('\r\n');
    const mLineIndex = lines.findIndex(l => l.startsWith('m=video'));
    if (mLineIndex === -1) return sdp;
    const h264Payloads = lines
      .filter(l => l.startsWith('a=rtpmap:') && l.toLowerCase().includes('h264'))
      .map(l => l.split(':')[1].split(' ')[0]);
    if (!h264Payloads.length) return sdp;
    const mParts = lines[mLineIndex].split(' ');
    const others = mParts.slice(3).filter(p => !h264Payloads.includes(p));
    lines[mLineIndex] = [...mParts.slice(0, 3), ...h264Payloads, ...others].join(' ');
    return lines.join('\r\n');
  }

  // Har TV ke liye alag encode hota hai, isliye TV count ke hisaab se bitrate baanto
  function perTvBitrateKbps() {
    const n = Math.max(1, callsByTv.size);
    return Math.max(450, Math.min(1800, Math.round(4000 / n)));
  }

  function tuneCall(call) {
    if (!call || !call.peerConnection) return;
    const kbps = perTvBitrateKbps();
    call.peerConnection.getSenders().forEach((sender) => {
      if (!sender.track) return;
      const params = sender.getParameters();
      if (!params.encodings || !params.encodings.length) params.encodings = [{}];
      if (sender.track.kind === 'video') {
        params.encodings[0].maxBitrate = kbps * 1000;
        params.encodings[0].maxFramerate = 24;
        params.degradationPreference = 'maintain-framerate';
      } else {
        params.encodings[0].maxBitrate = 128000; // stereo-quality audio
      }
      sender.setParameters(params).catch(() => {});
    });
  }

  function retuneAll() {
    callsByTv.forEach((call) => tuneCall(call));
  }

  const statusEl = document.getElementById('status');
  const tvStateEl = document.getElementById('tv-state');
  const connectedTVs = new Map();   // tvPeerId -> data connection
  const callsByTv = new Map();      // tvPeerId -> media call
  let currentStream = null;
  let useBackCamera = true;
  let peer = null;

  const liveState = {
    mode: 'standby',
    youtubeUrl: null,
    ytStartedAt: 0,
    photoData: null,
    marquee: 'अंशी TV पर आपका स्वागत है!'
  };

  function setStatus(msg, isError = false) {
    statusEl.style.color = isError ? '#f87171' : '#4ade80';
    statusEl.innerText = msg;
  }

  function updateTVCountBadge() {
    let openCount = 0;
    connectedTVs.forEach((conn, id) => {
      if (conn && conn.open) openCount++;
      else connectedTVs.delete(id);
    });
    if (openCount > 0) {
      tvStateEl.style.color = '#4ade80';
      tvStateEl.innerText = `🟢 ${openCount} TV Connected`;
    } else {
      tvStateEl.style.color = '#facc15';
      tvStateEl.innerText = '🟡 Waiting for TV...';
    }
  }

  function closeCallFor(tvPeerId) {
    const old = callsByTv.get(tvPeerId);
    if (old) { try { old.close(); } catch (e) {} }
    callsByTv.delete(tvPeerId);
  }

  function callTV(tvPeerId, stream) {
    closeCallFor(tvPeerId);
    const call = peer.call(tvPeerId, stream, { sdpTransform: forceH264 });
    if (!call) return;
    callsByTv.set(tvPeerId, call);
    call.on('close', () => { if (callsByTv.get(tvPeerId) === call) callsByTv.delete(tvPeerId); });
    call.on('error', () => { if (callsByTv.get(tvPeerId) === call) callsByTv.delete(tvPeerId); });
    setTimeout(retuneAll, 700);
    setTimeout(retuneAll, 2500);
  }

  function syncNewTV(tvPeerId, conn) {
    conn.send({ marquee: liveState.marquee });
    if (liveState.mode === 'youtube' && liveState.youtubeUrl) {
      const elapsed = Math.max(0, Math.floor((Date.now() - liveState.ytStartedAt) / 1000));
      conn.send({ youtubeUrl: liveState.youtubeUrl, startSeconds: elapsed });
    } else if (liveState.mode === 'photo' && liveState.photoData) {
      conn.send({ photo: liveState.photoData });
    } else if (liveState.mode === 'stream' && currentStream) {
      callTV(tvPeerId, currentStream);
    }
  }

  function initControllerPeer() {
    peer = new Peer(CONTROLLER_ID, { config: ICE_CONFIG });

    peer.on('open', () => {
      updateTVCountBadge();
      setStatus('✅ रिमोट तैयार है! अब TV खोलें।');
    });

    peer.on('connection', (conn) => {
      conn.on('open', () => {
        connectedTVs.set(conn.peer, conn);
        updateTVCountBadge();
        syncNewTV(conn.peer, conn);
      });
      const gone = () => {
        connectedTVs.delete(conn.peer);
        closeCallFor(conn.peer);
        updateTVCountBadge();
        retuneAll();
      };
      conn.on('close', gone);
      conn.on('error', gone);
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) peer.reconnect();
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        setStatus('⚠️ दूसरा कंट्रोलर पहले से खुला है! उसे बंद करके 20 सेकंड बाद रिफ़्रेश करें।', true);
      } else if (err.type === 'peer-unavailable') {
        // koi TV beech me gayab ho gaya, ignore
      } else {
        setStatus('Network Error: ' + err.type, true);
      }
    });
  }

  initControllerPeer();

  // Band ho chuki connections saaf karte raho
  setInterval(updateTVCountBadge, 4000);

  function broadcastData(payload, successMsg) {
    updateTVCountBadge();
    if (connectedTVs.size === 0) {
      return setStatus('⚠️ कोई भी TV कनेक्ट नहीं है! पहले TV पर tv.html खोलें।', true);
    }
    connectedTVs.forEach((conn) => { if (conn && conn.open) conn.send(payload); });
    if (successMsg) setStatus(`${successMsg} (${connectedTVs.size} TV)`);
  }

  function broadcastStream(stream) {
    updateTVCountBadge();
    if (connectedTVs.size === 0) {
      return setStatus('⚠️ कोई भी TV कनेक्ट नहीं है! पहले TV पर tv.html खोलें।', true);
    }
    connectedTVs.forEach((conn, tvPeerId) => {
      if (conn && conn.open) callTV(tvPeerId, stream);
    });
  }

  function playYouTubeOnTV() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) return setStatus('YouTube लिंक डालें!', true);
    stopLocalMedia();
    liveState.mode = 'youtube';
    liveState.youtubeUrl = url;
    liveState.ytStartedAt = Date.now();
    liveState.photoData = null;
    broadcastData({ youtubeUrl: url, startSeconds: 0 }, '▶ YouTube चल रहा है!');
  }

  function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 1280 / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function sendPhotoToTV() {
    const file = document.getElementById('photo-input').files[0];
    if (!file) return setStatus('पहले फ़ोटो चुनें!', true);
    stopLocalMedia();
    compressImage(file, (dataUrl) => {
      liveState.mode = 'photo';
      liveState.photoData = dataUrl;
      liveState.youtubeUrl = null;
      broadcastData({ photo: dataUrl }, '🖼️ फ़ोटो दिख रही है!');
    });
  }

  function streamGalleryVideo() {
    const file = document.getElementById('gallery-video-input').files[0];
    if (!file) return setStatus('पहले वीडियो चुनें!', true);
    stopLocalMedia();
    const vidPlayer = document.getElementById('gallery-video-player');
    vidPlayer.muted = false;   // muted hua to captureStream me audio nahi jaata
    vidPlayer.volume = 1.0;
    vidPlayer.src = URL.createObjectURL(file);
    vidPlayer.style.display = 'block';
    vidPlayer.loop = true;

    vidPlayer.onloadedmetadata = async () => {
      try { await vidPlayer.play(); }
      catch (e) { setStatus('वीडियो पर एक बार Play दबाएं', true); return; }

      const capture = vidPlayer.captureStream ? vidPlayer.captureStream.bind(vidPlayer) : vidPlayer.mozCaptureStream.bind(vidPlayer);
      let stream = capture();

      // audio track kabhi kabhi der se aata hai
      let tries = 0;
      while (stream.getAudioTracks().length === 0 && tries < 10) {
        await new Promise(r => setTimeout(r, 150));
        stream = capture();
        tries++;
      }

      currentStream = stream;
      liveState.mode = 'stream';
      liveState.youtubeUrl = null;
      liveState.photoData = null;
      broadcastStream(stream);
      setStatus(stream.getAudioTracks().length ? '🎬 वीडियो + आवाज़ चल रही है!' : '🎬 वीडियो चल रहा है (इसमें आवाज़ नहीं मिली)');
    };
  }

  async function getCameraStream() {
    return navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: useBackCamera ? 'environment' : 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        aspectRatio: { ideal: 1.7777777778 },
        frameRate: { ideal: 24, max: 24 }
      },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
  }

  async function startCamera() {
    if (!window.isSecureContext) {
      return setStatus('⚠️ कैमरा के लिए HTTPS लिंक चाहिए (file:// या http:// नहीं चलेगा)', true);
    }
    try {
      stopLocalMedia();
      currentStream = await getCameraStream();
      const preview = document.getElementById('camera-preview');
      preview.srcObject = currentStream;
      preview.style.display = 'block';
      liveState.mode = 'stream';
      liveState.youtubeUrl = null;
      liveState.photoData = null;
      broadcastStream(currentStream);
      setStatus(currentStream.getAudioTracks().length
        ? '🔴 लाइव कैमरा + माइक चालू है!'
        : '⚠️ कैमरा चालू है पर माइक नहीं मिला (Mic permission Allow करें)', currentStream.getAudioTracks().length === 0);
    } catch (err) {
      setStatus('Camera/Mic Error: ' + err.message, true);
    }
  }

  // Camera बदलते समय TV पर रुकावट न आए: sirf video track replace karo
  async function switchCamera() {
    useBackCamera = !useBackCamera;
    const isCameraLive = currentStream && liveState.mode === 'stream' &&
      document.getElementById('camera-preview').style.display === 'block';
    if (!isCameraLive) return;
    try {
      const newStream = await getCameraStream();
      const newVideo = newStream.getVideoTracks()[0];
      callsByTv.forEach((call) => {
        if (!call.peerConnection) return;
        call.peerConnection.getSenders().forEach((s) => {
          if (s.track && s.track.kind === 'video') s.replaceTrack(newVideo).catch(() => {});
        });
      });
      const oldVideo = currentStream.getVideoTracks()[0];
      if (oldVideo) { currentStream.removeTrack(oldVideo); oldVideo.stop(); }
      currentStream.addTrack(newVideo);
      newStream.getAudioTracks().forEach(t => t.stop()); // purana mic hi chalne do
      document.getElementById('camera-preview').srcObject = currentStream;
      setStatus('🔄 कैमरा बदल गया');
    } catch (err) {
      setStatus('Camera Error: ' + err.message, true);
    }
  }

  function updateMarquee() {
    const marquee = document.getElementById('marquee-input').value.trim();
    if (!marquee) return setStatus('टेक्स्ट लिखें!', true);
    liveState.marquee = marquee;
    broadcastData({ marquee: marquee }, '✅ न्यूज़ अपडेट हो गई!');
  }

  function stopLocalMedia() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    callsByTv.forEach((call) => { try { call.close(); } catch (e) {} });
    callsByTv.clear();
    document.getElementById('camera-preview').style.display = 'none';
    const galVid = document.getElementById('gallery-video-player');
    galVid.onloadedmetadata = null;
    galVid.pause();
    galVid.removeAttribute('src');
    galVid.load();
    galVid.style.display = 'none';
  }

  function stopEverything() {
    liveState.mode = 'standby';
    liveState.youtubeUrl = null;
    liveState.photoData = null;
    broadcastData({ stopAll: true }, '⏹ सभी TV बंद कर दिए गए।');
    stopLocalMedia();
  }

  function refreshAllTVs() {
    broadcastData({ forceRefresh: true }, '🔄 सभी TV रिफ़्रेश होकर वहीं से लाइव चलेंगे...');
  }
</script>
</body>
</html>
