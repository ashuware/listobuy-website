<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live TV Phone Controller</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f; color: #fff; padding: 16px; max-width: 480px; margin: auto;
    }
    h2 { font-size: 19px; color: #ffcc00; margin-bottom: 12px; }
    .card {
      background: #1a1a1a; padding: 15px; border-radius: 12px;
      margin-bottom: 14px; border: 1px solid #2a2a2a;
    }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%; padding: 13px 10px; border: none; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-live { background: #e60000; color: #fff; }
    .btn-stop { background: #333; color: #fff; }
    .btn-switch { background: #262626; color: #ddd; margin-top: 10px; padding: 10px; font-size: 13px; }
    .btn-photo { background: #1f6feb; color: #fff; }
    .btn-video { background: #2ea043; color: #fff; margin-top: 6px; }
    .btn-update { background: #ffcc00; color: #000; margin-top: 6px; }
    
    input[type="text"], input[type="file"] {
      width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #333;
      background: #252525; color: #fff; font-size: 14px; margin-bottom: 10px;
    }
    video {
      width: 100%; height: 200px; background: #000; margin-top: 10px;
      border-radius: 10px; object-fit: cover; display: none;
    }
    #status { margin-bottom: 12px; font-size: 13px; color: #4ade80; text-align: center; font-weight: 600; min-height: 18px; }
  </style>
</head>
<body>

  <h2>📡 Live TV Phone Controller</h2>
  <div id="status"></div>

  <!-- 1. Phone Live Camera -->
  <div class="card">
    <div class="card-title">1. Phone Live Camera</div>
    <div class="row-btns">
      <button class="btn-live" onclick="startCamera()">🔴 Go Live</button>
      <button class="btn-stop" onclick="stopEverything()">⏹ Stop TV</button>
    </div>
    <button class="btn-switch" onclick="switchCamera()">🔄 Switch Front / Back Camera</button>
    <video id="camera-preview" muted autoplay playsinline></video>
  </div>

  <!-- 2. Phone Gallery Photo Display -->
  <div class="card">
    <div class="card-title">2. Show Photo from Phone</div>
    <input type="file" id="photo-input" accept="image/*">
    <button class="btn-photo" onclick="sendPhotoToTV()">🖼️ Show Photo on TV</button>
  </div>

  <!-- 3. Phone Gallery Video Stream -->
  <div class="card">
    <div class="card-title">3. Play Video from Phone Gallery</div>
    <input type="file" id="gallery-video-input" accept="video/*">
    <button class="btn-video" onclick="streamGalleryVideo()">🎬 Play Phone Video on TV</button>
    <video id="gallery-video-player" controls playsinline></video>
  </div>

  <!-- 4. Logo & Marquee Ticker -->
  <div class="card">
    <div class="card-title">4. Channel Logo & Marquee Text</div>
    <input type="text" id="marquee-input" placeholder="Niche chalne wala Marquee text likhein...">
    <input type="file" id="logo-input" accept="image/*" onchange="handleLogo(this)">
    <button class="btn-update" onclick="updateOverlay()">📺 Update Logo & Marquee</button>
  </div>

<script>
  const CHANNEL_ID = 'aashish-domain-live-tv-01';
  const peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  const statusEl = document.getElementById('status');
  let logoBase64 = '';
  let currentStream = null;
  let currentCall = null;
  let useBackCamera = true;

  function setStatus(msg, isError = false) {
    statusEl.style.color = isError ? '#f87171' : '#4ade80';
    statusEl.innerText = msg;
  }

  function sendPayload(payload, successMsg) {
    const conn = peer.connect(CHANNEL_ID);
    conn.on('open', () => {
      conn.send(payload);
      if (successMsg) setStatus(successMsg);
    });
    conn.on('error', () => setStatus('⚠️ TV Screen abhi open nahi hai!', true));
  }

  function compressImage(file, maxWidth, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function sendPhotoToTV() {
    const file = document.getElementById('photo-input').files[0];
    if (!file) return setStatus('Pehle koi photo select karein!', true);

    stopLocalMedia();
    setStatus('⏳ Photo TV par bhej rahe hain...');
    compressImage(file, 1280, (compressedDataUrl) => {
      sendPayload({ photo: compressedDataUrl }, '🖼️ Photo TV screen par dikh rahi hai!');
    });
  }

  function streamGalleryVideo() {
    const file = document.getElementById('gallery-video-input').files[0];
    if (!file) return setStatus('Pehle gallery se video select karein!', true);

    stopLocalMedia();
    const vidPlayer = document.getElementById('gallery-video-player');
    vidPlayer.src = URL.createObjectURL(file);
    vidPlayer.style.display = 'block';
    vidPlayer.loop = true;

    vidPlayer.onloadedmetadata = () => {
      vidPlayer.play();
      const stream = vidPlayer.captureStream ? vidPlayer.captureStream() : vidPlayer.mozCaptureStream();
      currentCall = peer.call(CHANNEL_ID, stream);
      setStatus('🎬 Phone ka video TV par chal raha hai!');
    };
  }

  async function startCamera() {
    try {
      stopLocalMedia();
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: useBackCamera ? 'environment' : 'user' },
        audio: true
      });
      const preview = document.getElementById('camera-preview');
      preview.srcObject = currentStream;
      preview.style.display = 'block';

      currentCall = peer.call(CHANNEL_ID, currentStream);
      setStatus('🔴 Phone Camera TV par LIVE hai!');
    } catch (err) {
      setStatus('Camera Error: ' + err.message, true);
    }
  }

  function switchCamera() {
    useBackCamera = !useBackCamera;
    if (currentStream) startCamera();
    else setStatus(useBackCamera ? 'Back Camera selected' : 'Front Camera selected');
  }

  function handleLogo(input) {
    const file = input.files[0];
    if (!file) return;
    compressImage(file, 400, (dataUrl) => {
      logoBase64 = dataUrl;
      setStatus('✅ Logo ready! "Update Logo & Marquee" dabayein.');
    });
  }

  function updateOverlay() {
    const marquee = document.getElementById('marquee-input').value.trim();
    if (!marquee && !logoBase64) return setStatus('Text likhein ya logo chunein!', true);
    sendPayload({ marquee: marquee, logo: logoBase64 }, '✅ Logo & Marquee Updated!');
  }

  function stopLocalMedia() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    if (currentCall) {
      currentCall.close();
      currentCall = null;
    }
    const camPrev = document.getElementById('camera-preview');
    camPrev.style.display = 'none';

    const galVid = document.getElementById('gallery-video-player');
    galVid.pause();
    galVid.src = '';
    galVid.style.display = 'none';
  }

  function stopEverything() {
    stopLocalMedia();
    sendPayload({ stopAll: true }, '⏹ Broadcast rok diya gaya hai.');
  }
</script>
</body>
</html>
