<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live TV Phone Controller</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f; color: #fff; padding: 16px; max-width: 480px; margin: auto;
    }
    h2 { font-size: 19px; color: #ffcc00; margin-bottom: 14px; }
    .card {
      background: #1a1a1a; padding: 15px; border-radius: 12px;
      margin-bottom: 15px; border: 1px solid #2a2a2a;
    }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%; padding: 14px 10px; border: none; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-live { background: #e60000; color: #fff; }
    .btn-stop { background: #333; color: #fff; }
    .btn-switch { background: #262626; color: #ddd; margin-top: 10px; padding: 11px; font-size: 13px; }
    .btn-update { background: #ffcc00; color: #000; margin-top: 6px; }
    
    input[type="text"], input[type="file"] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #252525; color: #fff; font-size: 15px; margin-bottom: 10px;
    }
    #local-preview {
      width: 100%; height: 220px; background: #000; margin-top: 12px;
      border-radius: 10px; object-fit: cover; display: none;
    }
    #status { margin-top: 10px; font-size: 13px; color: #4ade80; text-align: center; }
  </style>
</head>
<body>

  <h2>📡 Live Camera & TV Control</h2>

  <!-- 1. Live Camera Controls -->
  <div class="card">
    <div class="card-title">1. Phone Live Camera</div>
    <div class="row-btns">
      <button class="btn-live" onclick="startLive()">🔴 Go Live</button>
      <button class="btn-stop" onclick="stopLive()">⏹ Stop Live</button>
    </div>
    <button class="btn-switch" onclick="switchCamera()">🔄 Switch Front / Back Camera</button>
    <video id="local-preview" muted autoplay playsinline></video>
  </div>

  <!-- 2. Logo & Marquee Controls -->
  <div class="card">
    <div class="card-title">2. Channel Logo & Marquee Text</div>
    <input type="text" id="marquee-input" placeholder="Niche chalne wala Marquee text likhein...">
    <input type="file" id="logo-input" accept="image/*" onchange="handleLogo(this)">
    <button class="btn-update" onclick="updateOverlay()">📺 Update Logo & Marquee</button>
    <div id="status"></div>
  </div>

<script>
  const CHANNEL_ID = 'aashish-domain-live-tv-01';
  const peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  const statusEl = document.getElementById('status');
  let logoBase64 = '';
  let currentStream = null;
  let currentCall = null;
  let useBackCamera = true;

  function handleLogo(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      logoBase64 = e.target.result;
      statusEl.style.color = '#4ade80';
      statusEl.innerText = '✅ Logo ready! Ab "Update Logo & Marquee" dabayein.';
    };
    reader.readAsDataURL(file);
  }

  function sendPayload(payload, msg) {
    const conn = peer.connect(CHANNEL_ID);
    conn.on('open', () => {
      conn.send(payload);
      statusEl.style.color = '#4ade80';
      statusEl.innerText = msg;
    });
    conn.on('error', () => {
      statusEl.style.color = '#f87171';
      statusEl.innerText = '⚠️ TV Screen abhi open nahi hai!';
    });
  }

  function updateOverlay() {
    const marquee = document.getElementById('marquee-input').value.trim();
    if (!marquee && !logoBase64) {
      statusEl.style.color = '#ffcc00';
      statusEl.innerText = 'Pehle text likhein ya logo select karein!';
      return;
    }
    sendPayload({ marquee: marquee, logo: logoBase64 }, '✅ Logo & Marquee TV par update ho gaya!');
  }

  async function startLive() {
    try {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: useBackCamera ? 'environment' : 'user' },
        audio: true
      });
      const preview = document.getElementById('local-preview');
      preview.srcObject = currentStream;
      preview.style.display = 'block';

      currentCall = peer.call(CHANNEL_ID, currentStream);
      statusEl.style.color = '#4ade80';
      statusEl.innerText = '🔴 Aapka Phone Camera TV par LIVE hai!';
    } catch (err) {
      statusEl.style.color = '#f87171';
      statusEl.innerText = 'Camera Error: ' + err.message;
    }
  }

  function switchCamera() {
    useBackCamera = !useBackCamera;
    if (currentStream) startLive();
    else statusEl.innerText = useBackCamera ? 'Back Camera selected' : 'Front Camera selected';
  }

  function stopLive() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    if (currentCall) {
      currentCall.close();
      currentCall = null;
    }
    document.getElementById('local-preview').style.display = 'none';
    sendPayload({ stopLive: true }, '⏹ Live Broadcast rok diya gaya hai.');
  }
</script>
</body>
</html>
