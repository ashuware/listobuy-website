<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>अंशी TV Controller</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f; color: #fff; padding: 14px; max-width: 480px; margin: auto;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { font-size: 19px; color: #ffcc00; }
    #tv-state { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #222; font-weight: bold; }
    .card {
      background: #1a1a1a; padding: 14px; border-radius: 10px;
      margin-bottom: 12px; border: 1px solid #2a2a2a;
    }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      width: 100%; padding: 12px 10px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .btn-live { background: #e60000; color: #fff; }
    .btn-stop { background: #333; color: #fff; }
    .btn-switch { background: #262626; color: #ddd; margin-top: 8px; padding: 10px; font-size: 13px; }
    .btn-yt { background: #ff0000; color: #fff; }
    .btn-photo { background: #1f6feb; color: #fff; }
    .btn-video { background: #2ea043; color: #fff; }
    .btn-update { background: #ffcc00; color: #000; }
    
    input[type="text"], input[type="file"] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
      background: #252525; color: #fff; font-size: 14px; margin-bottom: 8px;
    }
    video {
      width: 100%; height: 180px; background: #000; margin-top: 8px;
      border-radius: 8px; object-fit: cover; display: none;
    }
    #status { margin-bottom: 10px; font-size: 13px; color: #4ade80; text-align: center; font-weight: bold; min-height: 18px; }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>📡 अंशी TV रिमोट</h2>
    <div id="tv-state">🟡 Connecting...</div>
  </div>
  <div id="status"></div>

  <div class="card">
    <div class="card-title">1. लाइव कैमरा (Zero-Lag H.264)</div>
    <div class="row-btns">
      <button class="btn-live" onclick="startCamera()">🔴 Go Live</button>
      <button class="btn-stop" onclick="stopEverything()">⏹ Stop TV</button>
    </div>
    <button class="btn-switch" onclick="switchCamera()">🔄 कैमरा बदलें (Front/Back)</button>
    <video id="camera-preview" muted autoplay playsinline></video>
  </div>

  <div class="card">
    <div class="card-title">2. YouTube चलाएं</div>
    <input type="text" id="yt-url" placeholder="YouTube लिंक पेस्ट करें...">
    <button class="btn-yt" onclick="playYouTubeOnTV()">▶ Play YouTube</button>
  </div>

  <div class="card">
    <div class="card-title">3. फ़ोटो दिखाएं</div>
    <input type="file" id="photo-input" accept="image/*">
    <button class="btn-photo" onclick="sendPhotoToTV()">🖼️ Show Photo</button>
  </div>

  <div class="card">
    <div class="card-title">4. गैलरी वीडियो चलाएं</div>
    <input type="file" id="gallery-video-input" accept="video/*">
    <button class="btn-video" onclick="streamGalleryVideo()">🎬 Play Video</button>
    <video id="gallery-video-player" controls playsinline></video>
  </div>

  <div class="card">
    <div class="card-title">5. न्यूज़ पट्टी (Ticker)</div>
    <input type="text" id="marquee-input" placeholder="ताज़ा ख़बर लिखें...">
    <button class="btn-update" onclick="updateMarquee()">📺 Update News</button>
  </div>

<script>
  function forceH264(sdp) {
    const lines = sdp.split('\r\n');
    const mLineIndex = lines.findIndex(l => l.startsWith('m=video'));
    if (mLineIndex === -1) return sdp;
    const h264Payloads = lines
      .filter(l => l.startsWith('a=rtpmap:') && l.toLowerCase().includes('h264'))
      .map(l => l.split(':')[1].split(' ')[0]);
    if (!h264Payloads.length) return sdp;
    const mParts = lines[mLineIndex].split(' ');
    const others = mParts.slice(3).filter(p => !h264Payloads.includes(p));
    lines[mLineIndex] = [...mParts.slice(0, 3), ...h264Payloads, ...others].join(' ');
    return lines.join('\r\n');
  }

  function capVideoBitrate(call, maxKbps = 450) {
    if (!call || !call.peerConnection) return;
    call.peerConnection.getSenders().forEach((sender) => {
      if (sender.track && sender.track.kind === 'video') {
        const params = sender.getParameters();
        if (!params.encodings) params.encodings = [{}];
        params.encodings[0].maxBitrate = maxKbps * 1000;
        sender.setParameters(params).catch(() => {});
      }
    });
  }

  const CHANNEL_ID = 'aashish-domain-live-tv-01';
  const peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ],
      sdpSemantics: 'unified-plan'
    }
  });

  const statusEl = document.getElementById('status');
  const tvStateEl = document.getElementById('tv-state');
  let activeConn = null;
  let currentStream = null;
  let currentCall = null;
  let useBackCamera = true;

  function setStatus(msg, isError = false) {
    statusEl.style.color = isError ? '#f87171' : '#4ade80';
    statusEl.innerText = msg;
  }

  function connectToTV() {
    if (activeConn && activeConn.open) return;
    activeConn = peer.connect(CHANNEL_ID);
    activeConn.on('open', () => {
      tvStateEl.style.color = '#4ade80';
      tvStateEl.innerText = '🟢 TV Connected';
    });
    activeConn.on('close', () => {
      tvStateEl.style.color = '#f87171';
      tvStateEl.innerText = '🔴 TV Offline';
      activeConn = null;
    });
    activeConn.on('error', () => {
      tvStateEl.style.color = '#f87171';
      tvStateEl.innerText = '🔴 TV Offline';
    });
  }

  peer.on('open', connectToTV);
  setInterval(connectToTV, 4000);

  function sendFast(payload, successMsg) {
    if (activeConn && activeConn.open) {
      activeConn.send(payload);
      if (successMsg) setStatus(successMsg);
    } else {
      const tempConn = peer.connect(CHANNEL_ID);
      tempConn.on('open', () => {
        activeConn = tempConn;
        tvStateEl.style.color = '#4ade80';
        tvStateEl.innerText = '🟢 TV Connected';
        tempConn.send(payload);
        if (successMsg) setStatus(successMsg);
      });
      tempConn.on('error', () => setStatus('⚠️ TV स्क्रीन खुली नहीं है!', true));
    }
  }

  function playYouTubeOnTV() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) return setStatus('YouTube लिंक डालें!', true);
    stopLocalMedia();
    sendFast({ youtubeUrl: url }, '▶ YouTube TV पर चल रहा है!');
  }

  function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 720 / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function sendPhotoToTV() {
    const file = document.getElementById('photo-input').files[0];
    if (!file) return setStatus('पहले फ़ोटो चुनें!', true);
    stopLocalMedia();
    setStatus('⏳ फ़ोटो भेज रहे हैं...');
    compressImage(file, (dataUrl) => {
      sendFast({ photo: dataUrl }, '🖼️ फ़ोटो TV पर दिख रही है!');
    });
  }

  function streamGalleryVideo() {
    const file = document.getElementById('gallery-video-input').files[0];
    if (!file) return setStatus('पहले वीडियो चुनें!', true);
    stopLocalMedia();
    const vidPlayer = document.getElementById('gallery-video-player');
    vidPlayer.src = URL.createObjectURL(file);
    vidPlayer.style.display = 'block';
    vidPlayer.loop = true;

    vidPlayer.onloadedmetadata = () => {
      vidPlayer.play();
      const stream = vidPlayer.captureStream ? vidPlayer.captureStream(24) : vidPlayer.mozCaptureStream(24);
      currentCall = peer.call(CHANNEL_ID, stream, { sdpTransform: forceH264 });
      setTimeout(() => capVideoBitrate(currentCall, 450), 800);
      setStatus('🎬 वीडियो TV पर चल रहा है!');
    };
  }

  async function startCamera() {
    try {
      stopLocalMedia();
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: useBackCamera ? 'environment' : 'user',
          width: { ideal: 640 },
          height: { ideal: 360 },
          frameRate: { ideal: 24, max: 24 }
        },
        audio: true
      });

      const preview = document.getElementById('camera-preview');
      preview.srcObject = currentStream;
      preview.style.display = 'block';

      currentCall = peer.call(CHANNEL_ID, currentStream, { sdpTransform: forceH264 });
      setTimeout(() => capVideoBitrate(currentCall, 450), 800);
      setStatus('🔴 लाइव कैमरा + साउंड TV पर चालू है!');
    } catch (err) {
      setStatus('Camera/Mic Error: ' + err.message, true);
    }
  }

  function switchCamera() {
    useBackCamera = !useBackCamera;
    if (currentStream) startCamera();
  }

  function updateMarquee() {
    const marquee = document.getElementById('marquee-input').value.trim();
    if (!marquee) return setStatus('टेक्स्ट लिखें!', true);
    sendFast({ marquee: marquee }, '✅ न्यूज़ अपडेट हो गई!');
  }

  function stopLocalMedia() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    if (currentCall) {
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }
    document.getElementById('camera-preview').style.display = 'none';
    const galVid = document.getElementById('gallery-video-player');
    galVid.pause();
    galVid.removeAttribute('src');
    galVid.load();
    galVid.style.display = 'none';
  }

  function stopEverything() {
    // TV ko pehle stop command bhejein, phir local stream band karein
    sendFast({ stopAll: true }, '⏹ TV तुरंत बंद कर दिया गया।');
    stopLocalMedia();
  }
</script>
</body>
</html>
