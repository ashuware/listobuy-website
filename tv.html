<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>अंशी TV</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      background: #000; color: #fff; font-family: Arial, sans-serif;
      overflow: hidden; height: 100vh; width: 100vw;
    }
    #player-container { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
    
    video, #tv-photo, #yt-container {
      width: 100vw; height: 100vh; position: fixed; inset: 0; background: #000; border: none; pointer-events: none;
    }
    video { object-fit: cover; display: none; z-index: 5; }
    #tv-photo { object-fit: contain; display: none; z-index: 6; }
    #yt-container { display: none; z-index: 7; }
    #yt-container iframe { width: 100vw; height: 100vh; border: none; pointer-events: none; }

    /* One-time Fullscreen + Sound Unlocker Overlay */
    #fs-unlock-overlay {
      position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto; text-align: center; padding: 20px;
    }
    #fs-unlock-btn {
      padding: 20px 38px; font-size: 22px; font-weight: bold;
      background: #e60000; color: #fff; border: 2.5px solid #ffcc00;
      border-radius: 12px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
    }

    /* Invisible shield after unlock so TV remote buttons cannot pause/exit */
    #tv-input-shield {
      position: fixed; inset: 0; z-index: 9999; background: transparent;
      pointer-events: auto; cursor: none; display: none;
    }

    #standby-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #aaa; z-index: 2; text-align: center; padding: 20px;
    }
    #standby-screen h3 { color: #ffcc00; font-size: 30px; margin-bottom: 8px; }
    #conn-badge { font-size: 14px; color: #4ade80; margin-top: 8px; font-weight: bold; }

    #datetime-box {
      position: fixed; top: 18px; left: 22px; z-index: 20;
      background: rgba(0, 0, 0, 0.85); border-left: 4px solid #ffcc00; padding: 6px 12px;
    }
    #live-time { font-size: 18px; font-weight: bold; }
    #live-day-date { font-size: 12px; color: #ffcc00; margin-top: 2px; }

    #channel-logo {
      position: fixed; top: 18px; right: 22px; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0, 0, 0, 0.85); padding: 6px 14px; border: 1.5px solid #ffcc00; border-radius: 6px;
    }
    .anshi-hindi { font-size: 22px; font-weight: 900; color: #ffcc00; }
    .tv-box { background: #e60000; color: #fff; font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
    .live-dot { width: 10px; height: 10px; background: #ff0000; border-radius: 50%; }

    #ticker-bar {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 46px;
      background: #990000; display: flex; align-items: center; z-index: 20; border-top: 2px solid #ffcc00;
      overflow: hidden;
    }
    #breaking-tag {
      background: #ffcc00; color: #000; font-weight: 900; padding: 0 16px;
      height: 100%; display: flex; align-items: center; font-size: 15px; z-index: 2; white-space: nowrap;
    }
    #ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; }
    #marquee-text {
      display: inline-block; padding-left: 100%; font-size: 20px; font-weight: bold;
      animation: scroll-left 18s linear infinite; will-change: transform;
    }
    @keyframes scroll-left {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

<!-- 1-Tap Fullscreen + Sound Unlocker -->
<div id="fs-unlock-overlay">
  <button id="fs-unlock-btn">📺 Full Screen + Sound चालू करें (OK दबाएं)</button>
</div>

<!-- Locks all buttons after Fullscreen + Sound is activated -->
<div id="tv-input-shield"></div>

<div id="player-container">
  <div id="standby-screen">
    <h3>📡 अंशी TV LIVE</h3>
    <p>प्रसारण की प्रतीक्षा है...</p>
    <div id="conn-badge">⏳ जुड़ रहा है...</div>
  </div>

  <div id="datetime-box">
    <div id="live-time">--:--</div>
    <div id="live-day-date">...</div>
  </div>

  <div id="channel-logo">
    <span class="live-dot"></span>
    <span class="anshi-hindi">अंशी</span>
    <span class="tv-box">TV</span>
  </div>

  <img id="tv-photo" alt="">
  <div id="yt-container"></div>
  <video id="live-video" autoplay playsinline></video>

  <div id="ticker-bar">
    <div id="breaking-tag">ताज़ा ख़बर</div>
    <div id="ticker-wrap">
      <div id="marquee-text">अंशी TV पर आपका स्वागत है!</div>
    </div>
  </div>
</div>

<script>
  // apni Supabase Details yahan dalen:
   const SUPABASE_URL = 'https://mnscrpceekdbikgugaif.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_b-oIZWE82mCJZWHZrwKGhQ_MwBdRAlG';

  const videoEl = document.getElementById('live-video');
  const photoEl = document.getElementById('tv-photo');
  const ytContainer = document.getElementById('yt-container');
  const standbyEl = document.getElementById('standby-screen');
  const marqueeEl = document.getElementById('marquee-text');
  const connBadge = document.getElementById('conn-badge');
  const fsOverlay = document.getElementById('fs-unlock-overlay');
  const fsBtn = document.getElementById('fs-unlock-btn');
  const inputShield = document.getElementById('tv-input-shield');

  let isUnlocked = false;
  let activeIncomingCall = null;
  let myPeerId = null;
  let currentMode = 'standby';
  let activeYtUrl = null;
  let activePhotoHash = null;
  let activeStreamSession = -1;
  let lastMarquee = '';

  function enterFullScreenAndSound(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    if (isUnlocked) return;
    isUnlocked = true;

    // 1. Hide overlay & activate TV button lock shield
    fsOverlay.style.display = 'none';
    inputShield.style.display = 'block';
    document.body.style.cursor = 'none';

    // 2. Request Fullscreen on TV / Browser
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }

    // 3. Unlock Audio permanently at 100% volume
    videoEl.muted = false;
    videoEl.volume = 1.0;
    if (videoEl.srcObject) {
      videoEl.play().catch(() => {});
    }

    // 4. Reload active YouTube iframe if already playing so sound starts unmuted
    if (currentMode === 'youtube' && activeYtUrl) {
      const ytId = extractYouTubeID(activeYtUrl);
      if (ytId) {
        ytContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=0&controls=0&disablekb=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
      }
    }
  }

  fsOverlay.addEventListener('click', enterFullScreenAndSound);
  fsBtn.addEventListener('click', enterFullScreenAndSound);
  window.addEventListener('load', () => fsBtn.focus());

  // Lock all TV Remote buttons & Mouse clicks once unlocked
  ['keydown', 'keyup', 'keypress', 'click', 'dblclick', 'mousedown', 'mouseup', 'contextmenu', 'touchstart'].forEach(evt => {
    window.addEventListener(evt, (e) => {
      if (!isUnlocked) {
        enterFullScreenAndSound(e);
        return;
      }
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, { capture: true, passive: false });
  });

  function switchMode(newMode) {
    currentMode = newMode;

    if (newMode !== 'video') {
      videoEl.pause();
      videoEl.srcObject = null;
      videoEl.removeAttribute('src');
      videoEl.load();
      videoEl.style.display = 'none';
      activeStreamSession = -1;
      if (activeIncomingCall) {
        const oldCall = activeIncomingCall;
        activeIncomingCall = null;
        try { oldCall.close(); } catch (e) {}
      }
    }

    if (newMode !== 'photo') {
      photoEl.style.display = 'none';
      photoEl.removeAttribute('src');
      activePhotoHash = null;
    }

    if (newMode !== 'youtube') {
      ytContainer.innerHTML = '';
      ytContainer.style.display = 'none';
      activeYtUrl = null;
    }

    standbyEl.style.display = (newMode === 'standby') ? 'flex' : 'none';
  }

  function updateClock() {
    const now = new Date();
    const days = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
    const months = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
    document.getElementById('live-time').innerText = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
    document.getElementById('live-day-date').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
  }
  setInterval(updateClock, 10000);
  updateClock();

  function extractYouTubeID(url) {
    const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([^#&?]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  function forceH264(sdp) {
    const lines = sdp.split('\r\n');
    const mLineIndex = lines.findIndex(l => l.startsWith('m=video'));
    if (mLineIndex === -1) return sdp;
    const h264Payloads = lines
      .filter(l => l.startsWith('a=rtpmap:') && l.toLowerCase().includes('h264'))
      .map(l => l.split(':')[1].split(' ')[0]);
    if (!h264Payloads.length) return sdp;
    const mParts = lines[mLineIndex].split(' ');
    const others = mParts.slice(3).filter(p => !h264Payloads.includes(p));
    lines[mLineIndex] = [...mParts.slice(0, 3), ...h264Payloads, ...others].join(' ');
    return lines.join('\r\n');
  }

  const peer = new Peer({
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });

  peer.on('open', (id) => {
    myPeerId = id;
    announceOnline();
  });

  peer.on('disconnected', () => {
    if (peer && !peer.destroyed) peer.reconnect();
  });

  peer.on('call', (call) => {
    if (activeIncomingCall && activeIncomingCall !== call) {
      const prev = activeIncomingCall;
      activeIncomingCall = null;
      try { prev.close(); } catch (e) {}
    }

    activeIncomingCall = call;
    switchMode('video');
    call.answer(null, { sdpTransform: forceH264 });

    call.on('stream', (remoteStream) => {
      if (activeIncomingCall !== call) return;
      videoEl.style.display = 'block';
      videoEl.srcObject = remoteStream;
      videoEl.muted = false;
      videoEl.volume = 1.0;
      videoEl.play().catch(() => {
        videoEl.muted = true;
        videoEl.play();
      });
    });

    call.on('close', () => {
      if (activeIncomingCall === call) {
        activeIncomingCall = null;
        switchMode('standby');
      }
    });
  });

  function pullLiveStreamDirectly(controllerPeerId, sessionId) {
    if (!controllerPeerId || !myPeerId || activeStreamSession === sessionId) return;
    activeStreamSession = sessionId;
    const conn = peer.connect(controllerPeerId);
    conn.on('open', () => {
      conn.send({ requestStream: true });
    });
  }

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const channel = sb.channel('anshi-tv-live-room', {
    config: { broadcast: { self: false } }
  });

  function announceOnline() {
    if (myPeerId) {
      channel.send({
        type: 'broadcast',
        event: 'tv-online',
        payload: { peerId: myPeerId }
      });
    }
  }

  channel
    .on('broadcast', { event: 'tv-command' }, ({ payload }) => {
      // Reload ONLY when explicitly triggered from controller button
      if (payload.forceRefresh) {
        window.location.reload();
      }
    })
    .on('broadcast', { event: 'live-pulse' }, ({ payload }) => {
      if (!payload) return;

      if (payload.marquee && payload.marquee !== lastMarquee) {
        lastMarquee = payload.marquee;
        marqueeEl.innerText = payload.marquee;
      }

      if (payload.mode === 'standby') {
        if (currentMode !== 'standby') switchMode('standby');
        return;
      }

      if (payload.mode === 'youtube' && payload.youtubeUrl) {
        if (currentMode !== 'youtube' || activeYtUrl !== payload.youtubeUrl) {
          const ytId = extractYouTubeID(payload.youtubeUrl);
          if (ytId) {
            switchMode('youtube');
            activeYtUrl = payload.youtubeUrl;
            const muteParam = isUnlocked ? 0 : 1;
            ytContainer.style.display = 'block';
            ytContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=${muteParam}&start=${payload.startSeconds || 0}&controls=0&disablekb=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
          }
        }
        return;
      }

      if (payload.mode === 'photo' && payload.photo) {
        const hash = payload.photo.slice(-40);
        if (currentMode !== 'photo' || activePhotoHash !== hash) {
          switchMode('photo');
          activePhotoHash = hash;
          photoEl.onload = () => { photoEl.style.display = 'block'; };
          photoEl.src = payload.photo;
        }
        return;
      }

      if (payload.mode === 'stream' && payload.controllerPeerId) {
        if (currentMode !== 'video' || activeStreamSession !== payload.streamSessionId) {
          pullLiveStreamDirectly(payload.controllerPeerId, payload.streamSessionId);
        }
      }
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        connBadge.style.color = '#4ade80';
        connBadge.innerText = '🟢 अंशी TV ऑनलाइन है';
        announceOnline();
      }
    });

  // Only keep presence alive silently — NEVER reload page automatically
  setInterval(() => {
    announceOnline();
    if (peer && peer.disconnected && !peer.destroyed) {
      peer.reconnect();
    }
  }, 15000);
</script>
</body>
</html>
