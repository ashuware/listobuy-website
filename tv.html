<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>अंशी TV</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      background: #000; color: #fff; font-family: Arial, sans-serif;
      overflow: hidden; height: 100%; width: 100%;
    }
    #player-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    
    #live-video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000; border: none; display: none; z-index: 5;
    }
    #tv-photo {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; border: none; display: none; z-index: 6;
    }
    #yt-container {
      position: fixed; inset: 0; width: 100%; height: 100%;
      background: #000; display: none; z-index: 7; overflow: hidden;
    }
    #yt-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }

    #fs-unlock-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center; padding: 20px;
    }
    #fs-unlock-btn {
      padding: 18px 34px; font-size: 20px; font-weight: bold;
      background: #e60000; color: #fff; border: 3px solid #ffcc00;
      border-radius: 12px; cursor: pointer;
    }

    #standby-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #aaa; z-index: 2; text-align: center; padding: 20px;
    }
    #standby-screen h3 { color: #ffcc00; font-size: 32px; margin-bottom: 8px; }
    #conn-badge { font-size: 14px; color: #4ade80; margin-top: 8px; font-weight: bold; }

    #datetime-box {
      position: fixed; top: 18px; left: 22px; z-index: 20;
      background: rgba(0, 0, 0, 0.85); border-left: 4px solid #ffcc00; padding: 6px 12px;
      pointer-events: none;
    }
    #live-time { font-size: 18px; font-weight: bold; }
    #live-day-date { font-size: 12px; color: #ffcc00; margin-top: 2px; }

    #channel-logo {
      position: fixed; top: 18px; right: 22px; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0, 0, 0, 0.85); padding: 6px 14px; border: 1.5px solid #ffcc00; border-radius: 6px;
      pointer-events: none;
    }
    .anshi-hindi { font-size: 22px; font-weight: 900; color: #ffcc00; }
    .tv-box { background: #e60000; color: #fff; font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
    .live-dot { width: 10px; height: 10px; background: #ff0000; border-radius: 50%; }

    #ticker-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 46px;
      background: #990000; display: flex; align-items: center; z-index: 20; border-top: 2px solid #ffcc00;
      overflow: hidden; pointer-events: none;
    }
    #breaking-tag {
      background: #ffcc00; color: #000; font-weight: 900; padding: 0 16px;
      height: 100%; display: flex; align-items: center; font-size: 15px; z-index: 2; white-space: nowrap;
    }
    #ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; }
    #marquee-text {
      display: inline-block; padding-left: 100%; font-size: 20px; font-weight: bold;
      animation: scroll-left 18s linear infinite;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

<div id="fs-unlock-overlay">
  <button id="fs-unlock-btn">📺 अंशी TV चालू करें (Full Screen + Sound)</button>
</div>

<div id="player-container">
  <div id="standby-screen">
    <h3>📡 अंशी TV LIVE</h3>
    <p>प्रसारण की प्रतीक्षा है...</p>
    <div id="conn-badge">⏳ रिमोट से जुड़ रहा है...</div>
  </div>

  <div id="datetime-box">
    <div id="live-time">--:--</div>
    <div id="live-day-date">...</div>
  </div>

  <div id="channel-logo">
    <span class="live-dot"></span>
    <span class="anshi-hindi">अंशी</span>
    <span class="tv-box">TV</span>
  </div>

  <img id="tv-photo" alt="">
  <div id="yt-container"></div>
  <video id="live-video" autoplay playsinline></video>

  <div id="ticker-bar">
    <div id="breaking-tag">ताज़ा ख़बर</div>
    <div id="ticker-wrap">
      <div id="marquee-text">अंशी TV पर आपका स्वागत है!</div>
    </div>
  </div>
</div>

<script>
  var CONTROLLER_ID = 'anshi-tv-master-controller-99';

  var ICE_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      {
        urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  };

  var videoEl = document.getElementById('live-video');
  var photoEl = document.getElementById('tv-photo');
  var ytContainer = document.getElementById('yt-container');
  var standbyEl = document.getElementById('standby-screen');
  var marqueeEl = document.getElementById('marquee-text');
  var connBadge = document.getElementById('conn-badge');
  var fsOverlay = document.getElementById('fs-unlock-overlay');
  var fsBtn = document.getElementById('fs-unlock-btn');

  var isUnlocked = false;
  var activeIncomingCall = null;
  var peer = null;
  var masterConn = null;
  var currentMode = 'standby';
  var activeYtUrl = null;
  var activeYtStartedAt = 0;

  function unlockTV() {
    isUnlocked = true;
    fsOverlay.style.display = 'none';

    var elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(function() {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }

    videoEl.muted = false;
    videoEl.volume = 1.0;
    if (videoEl.srcObject) {
      videoEl.play().catch(function() {});
    }

    if (currentMode === 'youtube' && activeYtUrl) {
      var elapsed = activeYtStartedAt ? Math.max(0, Math.floor((Date.now() - activeYtStartedAt) / 1000)) : 0;
      playYouTubeAt(activeYtUrl, elapsed);
    }
  }

  fsOverlay.addEventListener('click', unlockTV);
  fsBtn.addEventListener('click', unlockTV);
  window.addEventListener('load', function() { fsBtn.focus(); });

  // Block TV remote keys only after unlocked
  window.addEventListener('keydown', function(e) {
    if (!isUnlocked) {
      unlockTV();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
  }, true);

  function switchMode(newMode) {
    currentMode = newMode;

    if (newMode !== 'video') {
      videoEl.pause();
      videoEl.srcObject = null;
      videoEl.removeAttribute('src');
      videoEl.load();
      videoEl.style.display = 'none';
      if (activeIncomingCall) {
        var oldCall = activeIncomingCall;
        activeIncomingCall = null;
        try { oldCall.close(); } catch (e) {}
      }
    }

    if (newMode !== 'photo') {
      photoEl.style.display = 'none';
      photoEl.removeAttribute('src');
    }

    if (newMode !== 'youtube') {
      ytContainer.innerHTML = '';
      ytContainer.style.display = 'none';
      activeYtUrl = null;
      activeYtStartedAt = 0;
    }

    standbyEl.style.display = (newMode === 'standby') ? 'flex' : 'none';
  }

  function playYouTubeAt(url, startSec) {
    var ytId = extractYouTubeID(url);
    if (!ytId) return;
    switchMode('youtube');
    activeYtUrl = url;
    var sec = Math.max(0, parseInt(startSec, 10) || 0);
    activeYtStartedAt = Date.now() - (sec * 1000);
    var muteFlag = isUnlocked ? 0 : 1;
    ytContainer.style.display = 'block';
    ytContainer.innerHTML = '<iframe src="https://www.youtube.com/embed/' + ytId + '?autoplay=1&mute=' + muteFlag + '&start=' + sec + '&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  }

  function updateClock() {
    var now = new Date();
    var days = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
    var months = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
    var hrs = now.getHours();
    var mins = now.getMinutes();
    var ampm = hrs >= 12 ? 'PM' : 'AM';
    hrs = hrs % 12;
    hrs = hrs ? hrs : 12;
    var minStr = mins < 10 ? '0' + mins : mins;
    document.getElementById('live-time').innerText = hrs + ':' + minStr + ' ' + ampm;
    document.getElementById('live-day-date').innerText = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
  }
  setInterval(updateClock, 10000);
  updateClock();

  function extractYouTubeID(url) {
    var regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([^#&?]{11})/;
    var match = url.match(regExp);
    return match ? match[1] : null;
  }

  function forceH264(sdp) {
    var lines = sdp.split('\r\n');
    var mLineIndex = -1;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf('m=video') === 0) { mLineIndex = i; break; }
    }
    if (mLineIndex === -1) return sdp;
    var h264Payloads = [];
    for (var j = 0; j < lines.length; j++) {
      if (lines[j].indexOf('a=rtpmap:') === 0 && lines[j].toLowerCase().indexOf('h264') !== -1) {
        h264Payloads.push(lines[j].split(':')[1].split(' ')[0]);
      }
    }
    if (!h264Payloads.length) return sdp;
    var mParts = lines[mLineIndex].split(' ');
    var others = mParts.slice(3).filter(function(p) { return h264Payloads.indexOf(p) === -1; });
    lines[mLineIndex] = mParts.slice(0, 3).concat(h264Payloads).concat(others).join(' ');
    return lines.join('\r\n');
  }

  function connectToController() {
    if (!peer || peer.disconnected || peer.destroyed || !peer.id) return;
    if (masterConn && masterConn.open) return;

    masterConn = peer.connect(CONTROLLER_ID, { reliable: true });

    masterConn.on('open', function() {
      connBadge.style.color = '#4ade80';
      connBadge.innerText = '🟢 अंशी TV रिमोट से जुड़ गया है';
    });

    masterConn.on('data', function(data) {
      if (!data) return;

      if (data.forceRefresh) {
        window.location.reload();
        return;
      }

      if (data.marquee) marqueeEl.innerText = data.marquee;

      if (data.youtubeUrl) {
        playYouTubeAt(data.youtubeUrl, data.startSeconds || 0);
      }

      if (data.photo) {
        switchMode('photo');
        photoEl.onload = function() { photoEl.style.display = 'block'; };
        photoEl.src = data.photo;
      }

      if (data.stopAll) {
        switchMode('standby');
      }
    });

    masterConn.on('close', function() {
      connBadge.style.color = '#facc15';
      connBadge.innerText = '🟡 रिमोट की प्रतीक्षा है...';
      masterConn = null;
    });

    masterConn.on('error', function() {
      masterConn = null;
    });
  }

  function initTVPeer() {
    peer = new Peer({ config: ICE_CONFIG });

    peer.on('open', function() {
      connectToController();
    });

    peer.on('disconnected', function() {
      if (peer && !peer.destroyed) peer.reconnect();
    });

    peer.on('call', function(call) {
      if (activeIncomingCall && activeIncomingCall !== call) {
        var prev = activeIncomingCall;
        activeIncomingCall = null;
        try { prev.close(); } catch (e) {}
      }

      activeIncomingCall = call;
      switchMode('video');
      call.answer(null, { sdpTransform: forceH264 });

      call.on('stream', function(remoteStream) {
        if (activeIncomingCall !== call) return;
        videoEl.style.display = 'block';
        videoEl.srcObject = remoteStream;
        videoEl.muted = !isUnlocked;
        videoEl.volume = 1.0;
        videoEl.play().catch(function() {
          videoEl.muted = true;
          videoEl.play();
        });
      });

      call.on('close', function() {
        if (activeIncomingCall === call) {
          activeIncomingCall = null;
          switchMode('standby');
        }
      });
    });
  }

  initTVPeer();
  setInterval(connectToController, 3000);
</script>
</body>
</html>
