<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अंशी TV</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://0.peerjs.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
    #player-container { position: relative; width: 100%; height: 100%; }
    
    video, #tv-photo, #yt-frame {
      width: 100%; height: 100%; position: absolute; inset: 0; background: #000; border: none;
    }
    video { object-fit: cover; display: none; z-index: 5; }
    #tv-photo { object-fit: contain; display: none; z-index: 6; }
    #yt-frame { display: none; z-index: 7; }

    #unmute-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer;
    }
    #unmute-overlay button {
      padding: 18px 36px; font-size: 20px; font-weight: bold;
      background: #e60000; color: #fff; border: 2px solid #ffcc00; border-radius: 10px; cursor: pointer;
    }

    #standby-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #aaa; z-index: 2; text-align: center; padding: 20px;
    }
    #standby-screen h3 { color: #ffcc00; font-size: 28px; margin-bottom: 8px; }
    #conn-badge { font-size: 13px; color: #4ade80; margin-top: 8px; font-weight: bold; }

    #datetime-box {
      position: absolute; top: 18px; left: 22px; z-index: 20;
      background: rgba(0, 0, 0, 0.85); border-left: 4px solid #ffcc00; padding: 6px 12px;
    }
    #live-time { font-size: 18px; font-weight: bold; }
    #live-day-date { font-size: 12px; color: #ffcc00; margin-top: 2px; }

    #channel-logo {
      position: absolute; top: 18px; right: 22px; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0, 0, 0, 0.85); padding: 6px 14px; border: 1.5px solid #ffcc00; border-radius: 6px;
    }
    .anshi-hindi { font-size: 22px; font-weight: 900; color: #ffcc00; }
    .tv-box { background: #e60000; color: #fff; font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
    .live-dot { width: 10px; height: 10px; background: #ff0000; border-radius: 50%; }

    #ticker-bar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 46px;
      background: #990000; display: flex; align-items: center; z-index: 20; border-top: 2px solid #ffcc00;
      overflow: hidden;
    }
    #breaking-tag {
      background: #ffcc00; color: #000; font-weight: 900; padding: 0 16px;
      height: 100%; display: flex; align-items: center; font-size: 15px; z-index: 2; white-space: nowrap;
    }
    #ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; }
    #marquee-text {
      display: inline-block; padding-left: 100%; font-size: 20px; font-weight: bold;
      animation: scroll-left 18s linear infinite; will-change: transform;
    }
    @keyframes scroll-left {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

<div id="player-container">
  <div id="unmute-overlay">
    <button id="start-btn">📺 अंशी TV चालू करें (OK दबाएं)</button>
  </div>

  <div id="standby-screen">
    <h3>📡 अंशी TV LIVE</h3>
    <p>प्रसारण की प्रतीक्षा है...</p>
    <div id="conn-badge">⏳ जुड़ रहा है...</div>
  </div>

  <div id="datetime-box">
    <div id="live-time">--:--</div>
    <div id="live-day-date">...</div>
  </div>

  <div id="channel-logo">
    <span class="live-dot"></span>
    <span class="anshi-hindi">अंशी</span>
    <span class="tv-box">TV</span>
  </div>

  <img id="tv-photo" alt="">
  <iframe id="yt-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  <video id="live-video" autoplay playsinline></video>

  <div id="ticker-bar">
    <div id="breaking-tag">ताज़ा ख़बर</div>
    <div id="ticker-wrap">
      <div id="marquee-text">अंशी TV पर आपका स्वागत है!</div>
    </div>
  </div>
</div>

<script>
  const videoEl = document.getElementById('live-video');
  const photoEl = document.getElementById('tv-photo');
  const ytFrame = document.getElementById('yt-frame');
  const standbyEl = document.getElementById('standby-screen');
  const marqueeEl = document.getElementById('marquee-text');
  const connBadge = document.getElementById('conn-badge');
  const unmuteOverlay = document.getElementById('unmute-overlay');
  const startBtn = document.getElementById('start-btn');

  let activeIncomingCall = null;
  let peer = null;
  const CHANNEL_ID = 'aashish-domain-live-tv-01';

  function startTV() {
    unmuteOverlay.style.display = 'none';
    videoEl.muted = false;
    videoEl.volume = 1.0;
    if (videoEl.srcObject) videoEl.play().catch(() => {});
  }

  unmuteOverlay.addEventListener('click', startTV);
  startBtn.addEventListener('click', startTV);
  window.addEventListener('load', () => startBtn.focus());

  function switchMode(newMode) {
    if (newMode !== 'video') {
      videoEl.pause();
      videoEl.srcObject = null;
      videoEl.style.display = 'none';
      if (activeIncomingCall) {
        const oldCall = activeIncomingCall;
        activeIncomingCall = null;
        try { oldCall.close(); } catch (e) {}
      }
    }

    if (newMode !== 'photo') {
      photoEl.style.display = 'none';
    }

    if (newMode !== 'youtube') {
      ytFrame.src = 'about:blank';
      ytFrame.style.display = 'none';
    }

    standbyEl.style.display = (newMode === 'standby') ? 'flex' : 'none';
  }

  function updateClock() {
    const now = new Date();
    const days = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
    const months = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
    document.getElementById('live-time').innerText = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
    document.getElementById('live-day-date').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
  }
  setInterval(updateClock, 10000);
  updateClock();

  function extractYouTubeID(url) {
    const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([^#&?]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  function forceH264(sdp) {
    const lines = sdp.split('\r\n');
    const mLineIndex = lines.findIndex(l => l.startsWith('m=video'));
    if (mLineIndex === -1) return sdp;
    const h264Payloads = lines
      .filter(l => l.startsWith('a=rtpmap:') && l.toLowerCase().includes('h264'))
      .map(l => l.split(':')[1].split(' ')[0]);
    if (!h264Payloads.length) return sdp;
    const mParts = lines[mLineIndex].split(' ');
    const others = mParts.slice(3).filter(p => !h264Payloads.includes(p));
    lines[mLineIndex] = [...mParts.slice(0, 3), ...h264Payloads, ...others].join(' ');
    return lines.join('\r\n');
  }

  function initPeer() {
    if (peer) {
      try { peer.destroy(); } catch (e) {}
    }

    // Empty iceServers on same Wi-Fi connects in 0.1s; Google STUN added as fallback
    peer = new Peer(CHANNEL_ID, {
      config: {
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      }
    });

    peer.on('open', () => {
      connBadge.style.color = '#4ade80';
      connBadge.innerText = '🟢 अंशी TV ऑनलाइन है';
    });

    peer.on('error', (err) => {
      connBadge.style.color = '#f87171';
      connBadge.innerText = err.type === 'unavailable-id'
        ? '⚠️ दूसरे टैब में TV खुला है, उसे बंद करें'
        : '🟡 Reconnecting...';
      setTimeout(initPeer, 1500);
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) peer.reconnect();
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.marquee) marqueeEl.innerText = data.marquee;

        if (data.youtubeUrl) {
          const ytId = extractYouTubeID(data.youtubeUrl);
          if (ytId) {
            switchMode('youtube');
            ytFrame.style.display = 'block';
            ytFrame.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
          }
        }

        if (data.photo) {
          switchMode('photo');
          photoEl.onload = () => {
            photoEl.style.display = 'block';
          };
          photoEl.src = data.photo;
        }

        if (data.stopAll) {
          switchMode('standby');
        }
      });
    });

    peer.on('call', (call) => {
      if (activeIncomingCall && activeIncomingCall !== call) {
        const prev = activeIncomingCall;
        activeIncomingCall = null;
        try { prev.close(); } catch (e) {}
      }

      activeIncomingCall = call;
      switchMode('video');
      call.answer(null, { sdpTransform: forceH264 });

      call.on('stream', (remoteStream) => {
        if (activeIncomingCall !== call) return;
        videoEl.style.display = 'block';
        videoEl.srcObject = remoteStream;
        videoEl.play().catch(() => {
          videoEl.muted = true;
          videoEl.play();
        });
      });

      call.on('close', () => {
        if (activeIncomingCall === call) {
          activeIncomingCall = null;
          switchMode('standby');
        }
      });
    });
  }

  initPeer();
</script>
</body>
</html>
